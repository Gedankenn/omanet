<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OMA // NET</title>
<style>
  @font-face { font-family: "Plex"; src: url("fonts/plex-sans.woff2") format("woff2"); font-weight: 100 700; font-display: swap; }
  @font-face { font-family: "JBM"; src: url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  :root {
    --bg: #05070d; --panel: #0a111b; --panel2: #0d1622;
    --line: rgba(34, 230, 255, .18); --line2: rgba(34, 230, 255, .38);
    --cy: #22e6ff; --mg: #ff3ea5; --lm: #9dff5a; --am: #ffc93c;
    --tx: #d9e8f2; --mu: #6c93ad; --dim: #31465a;
    --sans: "Plex", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "JBM", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--tx); font: 400 15px/1.5 var(--sans);
    background-image:
      radial-gradient(800px 380px at 84% -8%, rgba(34,230,255,.10), transparent 60%),
      radial-gradient(700px 420px at 6% 108%, rgba(255,62,165,.08), transparent 60%),
      linear-gradient(rgba(34,230,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,230,255,.045) 1px, transparent 1px);
    background-size: auto, auto, 32px 32px, 32px 32px;
    background-attachment: fixed;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    opacity: .25;
  }
  .wrap { width: min(100% - 40px, 1320px); margin: 0 auto; position: relative; z-index: 2; }
  header { border-bottom: 1px solid var(--line); background: rgba(5,7,13,.82); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px); }
  .top { display: flex; align-items: center; gap: 14px; height: 66px; }
  .mark { font: 700 11px/1 var(--mono); letter-spacing: .1em; color: var(--cy);
          border: 1px solid var(--line2); background: rgba(34,230,255,.08); padding: 8px 9px; }
  .brand { font-weight: 600; letter-spacing: -.01em; font-size: 17px; }
  .brand span { display: block; font: 500 10px/1.4 var(--mono); letter-spacing: .18em; color: var(--mu); }
  .clock { margin-left: auto; text-align: right; font: 500 11px/1.6 var(--mono); color: var(--mu); }
  .clock b { display: block; font-size: 15px; color: var(--tx); letter-spacing: .08em; }
  .ghost { border: 1px solid var(--line2); background: transparent; color: var(--cy); font: 600 10px/1 var(--mono);
           letter-spacing: .12em; padding: 10px 12px; cursor: pointer; }
  .ghost:hover { background: rgba(34,230,255,.1); }
  .ghost:disabled { opacity: .45; cursor: wait; }
  main { padding: 22px 0 60px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px 12px; position: relative; }
  .stat::before, .stat::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--cy); opacity: .55; }
  .stat::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .stat::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .stat b { display: block; font: 700 30px/1 var(--mono); letter-spacing: .02em; color: var(--cy); }
  .stat.lime b { color: var(--lm); } .stat.mag b { color: var(--mg); } .stat.amber b { color: var(--am); }
  .stat span { display: block; margin-top: 7px; font: 500 9.5px/1.2 var(--mono); letter-spacing: .16em; color: var(--mu); }
  h1.sec { font: 600 11px/1 var(--mono); letter-spacing: .2em; color: var(--mu); margin: 26px 0 12px;
           display: flex; align-items: center; gap: 10px; }
  h1.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--tx);
          padding: 14px 16px 12px; cursor: pointer; position: relative; font-family: var(--sans); }
  .card:hover, .card:focus-visible { border-color: var(--line2); background: var(--panel2);
          box-shadow: 0 0 24px rgba(34,230,255,.10); outline: none; }
  .card::before { content: ""; position: absolute; top: -1px; right: -1px; width: 12px; height: 12px;
                  border-top: 1px solid var(--cy); border-right: 1px solid var(--cy); opacity: .5; }
  .card.off { opacity: .72; }
  .crow { display: flex; align-items: center; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.on { background: var(--lm); box-shadow: 0 0 10px var(--lm); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { margin-left: auto; font: 600 8.5px/1 var(--mono); letter-spacing: .12em; padding: 5px 6px;
          border: 1px solid var(--line2); color: var(--cy); }
  .chip.off { color: var(--mu); border-color: var(--dim); }
  .ip { font: 600 22px/1.1 var(--mono); letter-spacing: .02em; margin: 9px 0 2px; color: var(--tx); }
  .vendor { font: 400 11px/1.3 var(--mono); color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metrics { display: flex; gap: 18px; margin: 12px 0 8px; }
  .metrics div { display: flex; flex-direction: column; gap: 2px; }
  .metrics b { font: 500 8.5px/1 var(--mono); letter-spacing: .14em; color: var(--mu); }
  .metrics span { font: 500 12.5px/1 var(--mono); color: var(--tx); }
  .bar { height: 3px; background: #101b28; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cy), var(--lm)); }
  .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px;
          font: 400 9.5px/1 var(--mono); letter-spacing: .06em; color: var(--mu); 
          white-space: nowrap; overflow: hidden; }
  .foot span { overflow: hidden; text-overflow: ellipsis; }
  .timeline { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px 10px; }
  .trow { display: grid; grid-template-columns: 150px 1fr 86px; gap: 12px; align-items: center; padding: 5px 0; }
  .trow .tname { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cells { display: grid; grid-template-columns: repeat(96, 1fr); gap: 1px; height: 18px; }
  .cells i { display: block; background: #0c141f; }
  .ttot { text-align: right; font: 500 10px/1 var(--mono); color: var(--mu); }
  .axis { display: grid; grid-template-columns: 150px 1fr 86px; gap: 12px; margin-top: 6px; }
  .axis div { display: flex; justify-content: space-between; font: 400 8.5px/1 var(--mono); color: var(--dim); }
  .empty { border: 1px dashed var(--line2); padding: 40px; text-align: center; color: var(--mu); font-family: var(--mono); font-size: 12px; letter-spacing: .08em; }
  footer { border-top: 1px solid var(--line); padding: 14px 0 26px; display: flex; justify-content: space-between; gap: 16px;
           font: 400 9.5px/1.4 var(--mono); letter-spacing: .1em; color: var(--dim); }
  footer b { color: var(--mu); font-weight: 500; }
  /* drawer */
  #shade { position: fixed; inset: 0; background: rgba(2,4,8,.6); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
  #shade.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; width: min(430px, 100%); height: 100%; background: #070d16;
            border-left: 1px solid var(--line2); transform: translateX(102%); transition: transform .2s ease; z-index: 21;
            padding: 22px 22px 30px; overflow-y: auto; }
  #drawer.open { transform: none; }
  #drawer .dhead { display: flex; align-items: center; gap: 10px; }
  #drawer h2 { margin: 0; font-size: 20px; font-weight: 600; }
  #drawer .close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--mu); font: 600 14px/1 var(--mono);
                   width: 30px; height: 30px; cursor: pointer; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; margin: 18px 0; font: 400 11.5px/1.4 var(--mono); }
  .kv dt { color: var(--mu); letter-spacing: .08em; font-size: 9.5px; text-transform: uppercase; }
  .kv dd { margin: 0; color: var(--tx); overflow-wrap: anywhere; }
  .rename { display: flex; gap: 8px; margin: 8px 0 20px; }
  .rename input { flex: 1; background: #0a121d; border: 1px solid var(--line); color: var(--tx);
                  font: 400 13px/1 var(--mono); padding: 10px; outline: none; }
  .rename input:focus { border-color: var(--cy); }
  .sessions { border-top: 1px solid var(--line); margin-top: 6px; }
  .srow { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(34,230,255,.07);
          font: 400 10.5px/1.3 var(--mono); color: var(--mu); }
  .srow b { color: var(--tx); font-weight: 500; }
  .live { color: var(--lm); }
  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .top { gap: 10px; } .clock { display: none; }
    .trow, .axis { grid-template-columns: 96px 1fr 70px; }
    .cells { height: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <span class="mark">OMA</span>
      <div class="brand">NET // GRID<span>PRESENÇA NA LAN · ARP</span></div>
      <div class="clock">PATO BRANCO · UTC−3<b id="clock">--:--:--</b></div>
      <button class="ghost" id="scanBtn" type="button">SCAN NOW</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat lime"><b id="sOnline">0</b><span>ONLINE AGORA</span></div>
      <div class="stat"><b id="sKnown">0</b><span>DISPOSITIVOS CONHECIDOS</span></div>
      <div class="stat mag"><b id="sSessions">0</b><span>SESSÕES 24H</span></div>
      <div class="stat amber"><b id="sNew">0</b><span>NOVOS 24H</span></div>
    </div>

    <h1 class="sec">// DISPOSITIVOS</h1>
    <div class="grid" id="grid"></div>

    <h1 class="sec">// UPLINK 24H</h1>
    <div class="timeline">
      <div id="timeline"></div>
      <div class="axis"><div></div><div><span>−24H</span><span>−18H</span><span>−12H</span><span>−6H</span><span>AGORA</span></div><div></div></div>
    </div>
  </main>
  <footer>
    <div><b>ARP-SCAN</b> · 60s · SQLITE · <span id="lastScan">—</span></div>
    <div id="ticker">LAN 192.168.5.0/24</div>
  </footer>
</div>

<div id="shade"></div>
<aside id="drawer" aria-label="Detalhes do dispositivo">
  <div class="dhead"><h2 id="dName">—</h2><button class="close" id="dClose" type="button">×</button></div>
  <div class="rename"><input id="dInput" maxlength="40" placeholder="nome do dispositivo"><button class="ghost" id="dSave" type="button">SALVAR</button></div>
  <dl class="kv" id="dKv"></dl>
  <div class="sessions" id="dSessions"></div>
</aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let state = null, fetchedAt = 0, currentMac = null, drawerData = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => n < 10 ? "0" + n : "" + n;
  const dur = (s) => {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}h ${pad(m)}m` : `${m}m`;
  };
  const hms = (s) => {
    s = Math.max(0, Math.floor(s));
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
  };
  const clockStr = (ts) => {
    const d = new Date(ts * 1000);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const ago = (s) => s < 60 ? `${Math.floor(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`;
  const disp = (d) => d.name || ((d.vendor && !d.vendor.trim().startsWith("(")) ? d.vendor
    : `Dispositivo ${(d.ip || "").split(".").pop() || d.mac.slice(-5)}`);
  const vend = (d) => (d.vendor && !d.vendor.trim().startsWith("(")) ? d.vendor : "vendor desconhecido";

  function tickClock() {
    const d = new Date();
    $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tickClock(); setInterval(tickClock, 1000);

  function liveTimers() {
    if (!state) return;
    const extra = (Date.now() - fetchedAt) / 1000;
    document.querySelectorAll("[data-cur]").forEach((el) => {
      const base = parseFloat(el.dataset.cur || "0");
      el.textContent = base > 0 ? hms(base + extra) : "—";
    });
    const last = state.last_scan ? (Date.now() / 1000 - state.last_scan) : null;
    $("lastScan").textContent = last === null ? "aguardando sweep" : `último sweep ${ago(last)} atrás`;
  }
  setInterval(liveTimers, 1000);

  async function refresh() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      state = await r.json();
      fetchedAt = Date.now();
      render();
      liveTimers();
      if (currentMac) openDrawer(currentMac, true);
    } catch (e) {
      $("ticker").textContent = "LINK PERDIDO — tentando novamente";
    }
  }

  function render() {
    const s = state.stats;
    $("sOnline").textContent = s.online;
    $("sKnown").textContent = s.known;
    $("sSessions").textContent = s.sessions_24h;
    $("sNew").textContent = s.new_24h;
    $("ticker").textContent = `LAN 192.168.5.0/24 · ${s.online} ONLINE · SWEEP ${state.interval}S`;

    const grid = $("grid");
    grid.innerHTML = state.devices.map((d) => {
      const pct = Math.min(100, Math.round(d.total_24h / 86400 * 100));
      return `<button class="card ${d.online ? "" : "off"}" data-mac="${esc(d.mac)}" type="button">
        <div class="crow"><span class="dot ${d.online ? "on" : ""}"></span>
          <span class="name">${esc(disp(d))}</span>
          <span class="chip ${d.online ? "" : "off"}">${d.online ? "ONLINE" : "OFFLINE"}</span></div>
        <div class="ip">${esc(d.ip || "—")}</div>
        <div class="vendor">${esc(vend(d))}</div>
        <div class="metrics">
          <div><b>AGORA</b><span data-cur="${d.current_session}">${d.current_session ? hms(d.current_session) : "—"}</span></div>
          <div><b>24H</b><span>${dur(d.total_24h)}</span></div>
          <div><b>SESSÕES</b><span>${d.sessions_24h}</span></div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="foot"><span>MAC ${esc(d.mac)}</span><span>${pct}% ONLINE</span></div>
      </button>`;
    }).join("") || `<div class="empty">NENHUM DISPOSITIVO AINDA — PRIMEIRO SWEEP EM ANDAMENTO</div>`;

    const tl = $("timeline");
    tl.innerHTML = state.devices.map((d) => {
      const cells = d.timeline.map((v, i) => {
        const t0 = new Date((state.now - 86400 + i * 900) * 1000);
        const t1 = new Date((state.now - 86400 + (i + 1) * 900) * 1000);
        const label = `${clockStr(t0.getTime() / 1000)}–${clockStr(t1.getTime() / 1000)} · ${Math.round(v * 100)}%`;
        const bg = v <= 0 ? "" : ` style="background:rgba(34,230,255,${0.16 + v * 0.84})"`;
        return `<i${bg} title="${label}"></i>`;
      }).join("");
      return `<div class="trow"><div class="tname">${esc(disp(d))}</div>
        <div class="cells">${cells}</div><div class="ttot">${dur(d.total_24h)}</div></div>`;
    }).join("") || `<div class="empty">SEM HISTÓRICO NAS ÚLTIMAS 24H</div>`;
  }

  async function openDrawer(mac, silent) {
    currentMac = mac;
    const r = await fetch(`/api/device?mac=${encodeURIComponent(mac)}`, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    drawerData = d;
    $("dName").textContent = disp(d);
    $("dInput").value = d.name || "";
    const st = d.online ? `<span class="live">ONLINE</span>` : "OFFLINE";
    const onlineNow = d.current_session ? hms(d.current_session + (Date.now() - fetchedAt) / 1000) : "—";
    $("dKv").innerHTML = `
      <dt>status</dt><dd>${st}</dd>
      <dt>ip</dt><dd>${esc(d.ip || "—")}</dd>
      <dt>mac</dt><dd>${esc(d.mac)}</dd>
      <dt>vendor</dt><dd>${esc(vend(d))}</dd>
      <dt>primeiro seen</dt><dd>${new Date(d.first_seen * 1000).toLocaleString("pt-BR")}</dd>
      <dt>último seen</dt><dd>${new Date(d.last_seen * 1000).toLocaleString("pt-BR")}</dd>
      <dt>agora</dt><dd>${onlineNow}</dd>
      <dt>total histórico</dt><dd>${dur(d.total_seconds)}</dd>`;
    $("dSessions").innerHTML = `<div class="srow"><b>INÍCIO</b><b>FIM</b><b>DURAÇÃO</b></div>` +
      d.sessions.map((s) => {
        const end = s.end ?? Math.floor(Date.now() / 1000);
        return `<div class="srow"><span>${new Date(s.start * 1000).toLocaleString("pt-BR")}</span>
          <span>${s.end ? new Date(s.end * 1000).toLocaleTimeString("pt-BR") : '<b class="live">AGORA</b>'}</span>
          <span>${dur(end - s.start)}</span></div>`;
      }).join("");
    if (!silent) {
      $("shade").classList.add("open");
      $("drawer").classList.add("open");
    }
  }

  function closeDrawer() {
    currentMac = null;
    $("shade").classList.remove("open");
    $("drawer").classList.remove("open");
  }

  $("grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) openDrawer(card.dataset.mac);
  });
  $("dClose").addEventListener("click", closeDrawer);
  $("shade").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  $("dSave").addEventListener("click", async () => {
    if (!currentMac) return;
    const name = $("dInput").value.trim();
    if (!name) return;
    await fetch("/api/name", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mac: currentMac, name })
    });
    await refresh();
    $("dName").textContent = name;
  });

  $("scanBtn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "SCANNING…";
    await fetch("/api/scan", { method: "POST" });
    setTimeout(async () => {
      await refresh();
      e.target.disabled = false;
      e.target.textContent = "SCAN NOW";
    }, 5000);
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
