<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OMA // NET</title>
<link rel="stylesheet" href="hybrid.css?v=1">
<style>
  /* page layer — CATHODE HYBRID v3. Tokens come from hybrid.css. */
  .hy { font: 400 12px/1.5 var(--hy-sans); }
  .wrap { width: min(100% - 40px, 1320px); margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--hy-line);
    background: color-mix(in srgb, var(--hy-bg) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .top { display: flex; align-items: center; gap: 14px; height: 64px; }
  .mark {
    font: 400 9px/1 var(--hy-sans); letter-spacing: 1.2px; color: var(--hy-cyan);
    border: 1px solid color-mix(in srgb, var(--hy-cyan) 38%, transparent);
    border-radius: var(--hy-r-sm);
    background: color-mix(in srgb, var(--hy-cyan) 7%, transparent);
    padding: 7px 8px;
  }
  .brand { font-size: 15px; letter-spacing: .2px; color: var(--hy-ink); }
  .brand span { display: block; margin-top: 3px; font-size: 9px; letter-spacing: 1.4px; color: var(--hy-mute); }
  .clock { margin-left: auto; text-align: right; font-size: 9px; letter-spacing: .8px; color: var(--hy-mute); }
  .clock b { display: block; margin-top: 3px; font-size: 15px; font-weight: 400; color: var(--hy-ink); letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .ghost {
    appearance: none; border: 1px solid var(--hy-line-hi); border-radius: var(--hy-r-sm);
    background: var(--hy-sunken); color: var(--hy-dim);
    font: 400 10px/1 var(--hy-sans); letter-spacing: .8px;
    padding: 9px 11px; min-height: 30px; cursor: pointer;
  }
  .ghost:hover { color: var(--hy-cyan); border-color: color-mix(in srgb, var(--hy-cyan) 55%, transparent); }
  .ghost:focus-visible { outline: 1px solid var(--hy-cyan); outline-offset: 1px; }
  .ghost:disabled { opacity: .45; cursor: wait; }

  main { padding: 20px 0 56px; }

  /* header numbers: pixel layer only */
  .stat {
    display: flex; flex-direction: column; gap: 7px;
    padding: 13px 15px 12px;
  }
  .stat b { font-family: var(--hy-pixel); font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: 0; color: var(--hy-ink); }
  .stat.lime b { color: var(--hy-lime); }
  .stat.mag b { color: var(--hy-magenta); }
  .stat.amber b { color: var(--hy-amber); }
  .stat span { font-size: 9px; letter-spacing: .9px; text-transform: uppercase; color: var(--hy-mute); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }

  h1.sec {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 10px; font-size: 10px; font-weight: 400;
    letter-spacing: 1.8px; text-transform: uppercase; color: var(--hy-mute);
  }
  h1.sec::after { content: ""; flex: 1; height: 1px; background: var(--hy-line); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }

  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    color: var(--hy-ink); font-family: var(--hy-sans);
    padding: 12px 14px 11px;
  }
  .card:hover, .card:focus-visible {
    outline: none;
    border-color: color-mix(in srgb, var(--hy-cyan) 55%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--hy-cyan) 6%, var(--hy-panel)), #090C13);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--hy-cyan) 18%, transparent),
                0 0 16px color-mix(in srgb, var(--hy-cyan) 18%, transparent);
  }
  .card.off { opacity: .62; }
  .crow { display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hy-mute); flex: 0 0 auto; }
  .dot.on { background: var(--hy-lime); box-shadow: 0 0 5px color-mix(in srgb, var(--hy-lime) 65%, transparent); }
  .name { font-size: 14px; color: var(--hy-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip {
    margin-left: auto; font-size: 8.5px; letter-spacing: .9px; text-transform: uppercase;
    padding: 3px 6px; border: 1px solid var(--hy-line); border-radius: var(--hy-r-sm); color: var(--hy-dim);
  }
  .chip.online { color: var(--hy-lime); border-color: color-mix(in srgb, var(--hy-lime) 40%, transparent); }
  .chip.off { color: var(--hy-mute); }

  .ip { margin: 9px 0 1px; font-family: var(--hy-pixel); font-size: 24px; line-height: 1.1; letter-spacing: 0; color: var(--hy-ink); }
  .vendor { font-size: 10px; color: var(--hy-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .metrics { display: flex; gap: 18px; margin: 10px 0 8px; }
  .metrics div { display: flex; flex-direction: column; gap: 3px; }
  .metrics b { font-size: 8.5px; font-weight: 400; letter-spacing: .9px; text-transform: uppercase; color: var(--hy-mute); }
  .metrics span { font-size: 12px; color: var(--hy-ink); font-variant-numeric: tabular-nums; }

  .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px;
          font-size: 9px; letter-spacing: .4px; color: var(--hy-mute); white-space: nowrap; }
  .foot span { overflow: hidden; text-overflow: ellipsis; }

  .timeline { padding: 13px 15px 10px; }
  .trow { display: grid; grid-template-columns: 148px 1fr 74px; gap: 12px; align-items: center; padding: 3px 0; }
  .trow .tname { font-size: 11px; color: var(--hy-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cells { display: grid; grid-template-columns: repeat(96, 1fr); gap: 2px; height: 12px; }
  .cells i { display: block; border-radius: var(--hy-r-sm); background: var(--hy-sunken); border: 1px solid color-mix(in srgb, var(--hy-line) 70%, transparent); }
  .ttot { text-align: right; font-size: 10px; color: var(--hy-mute); font-variant-numeric: tabular-nums; }
  .axis { display: grid; grid-template-columns: 148px 1fr 74px; gap: 12px; margin-top: 7px; }
  .axis div { display: flex; justify-content: space-between; font-size: 8.5px; letter-spacing: .5px; color: var(--hy-mute); }

  .empty { border: 1px dashed var(--hy-line-hi); border-radius: var(--hy-r); padding: 36px;
           text-align: center; color: var(--hy-mute); font-size: 11px; letter-spacing: .8px; }

  footer { border-top: 1px solid var(--hy-line); padding: 13px 0 24px; display: flex; justify-content: space-between;
           gap: 16px; font-size: 9px; letter-spacing: .6px; color: var(--hy-mute); }
  footer b { color: var(--hy-dim); font-weight: 400; }

  /* drawer */
  #shade { position: fixed; inset: 0; background: rgba(3,5,9,.66); opacity: 0; pointer-events: none;
           transition: opacity .15s; z-index: 20; }
  #shade.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; right: 0; width: min(430px, 100%); height: 100%;
    padding: 20px 22px 28px; overflow-y: auto; z-index: 21;
    background: linear-gradient(180deg, var(--hy-panel), #090C13);
    border-left: 1px solid var(--hy-line-hi);
    transform: translateX(102%); transition: transform .18s ease;
  }
  #drawer.open { transform: none; }
  #drawer .dhead { display: flex; align-items: center; gap: 10px; }
  #drawer h2 { margin: 0; font-size: 17px; font-weight: 400; color: var(--hy-ink); }
  #drawer .close { margin-left: auto; width: 28px; height: 28px; cursor: pointer;
                   background: var(--hy-sunken); border: 1px solid var(--hy-line); border-radius: var(--hy-r-sm);
                   color: var(--hy-dim); font: 400 13px/1 var(--hy-sans); }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 7px 12px; margin: 16px 0; font-size: 11px; }
  .kv dt { font-size: 9px; letter-spacing: .7px; text-transform: uppercase; color: var(--hy-mute); }
  .kv dd { margin: 0; color: var(--hy-ink); overflow-wrap: anywhere; }
  .rename { display: flex; gap: 6px; margin: 6px 0 18px; }
  .rename input { flex: 1; min-height: 30px; padding: 8px 10px; font: 400 12px/1 var(--hy-sans);
                  color: var(--hy-ink); background: var(--hy-sunken);
                  border: 1px solid var(--hy-line); border-radius: var(--hy-r-sm); outline: none; }
  .rename input:focus { border-color: var(--hy-cyan); }
  .sessions { border-top: 1px solid var(--hy-line); margin-top: 4px; }
  .srow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0;
          border-bottom: 1px solid color-mix(in srgb, var(--hy-line) 55%, transparent);
          font-size: 10px; color: var(--hy-dim); }
  .srow b { color: var(--hy-ink); font-weight: 400; }
  .live { color: var(--hy-lime); }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .top { gap: 10px; } .clock { display: none; }
    .stat b { font-size: 32px; }
    .trow, .axis { grid-template-columns: 92px 1fr 62px; }
    .cells { height: 10px; }
  }
</style>
</head>
<body class="hy">
<div class="wrap">
  <header>
    <div class="top">
      <span class="mark">OMA</span>
      <div class="brand">NET // GRID<span>PRESENÇA NA LAN · ARP</span></div>
      <div class="clock">PATO BRANCO · UTC−3<b id="clock">--:--:--</b></div>
      <button class="ghost" id="scanBtn" type="button">SCAN NOW</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat hy-card hy-card--lime lime"><b id="sOnline">0</b><span>ONLINE AGORA</span></div>
      <div class="stat hy-card hy-card--cyan"><b id="sKnown">0</b><span>DISPOSITIVOS CONHECIDOS</span></div>
      <div class="stat hy-card hy-card--magenta mag"><b id="sSessions">0</b><span>SESSÕES 24H</span></div>
      <div class="stat hy-card hy-card--amber amber"><b id="sNew">0</b><span>NOVOS 24H</span></div>
    </div>

    <h1 class="sec">// DISPOSITIVOS</h1>
    <div class="grid" id="grid"></div>

    <h1 class="sec">// UPLINK 24H</h1>
    <div class="timeline hy-card hy-card--cyan">
      <div id="timeline"></div>
      <div class="axis"><div></div><div><span>−24H</span><span>−18H</span><span>−12H</span><span>−6H</span><span>AGORA</span></div><div></div></div>
    </div>
  </main>
  <footer>
    <div><b>ARP-SCAN</b> · 60s · SQLITE · <span id="lastScan">—</span></div>
    <div id="ticker">LAN 192.168.5.0/24</div>
  </footer>
</div>

<div id="shade"></div>
<aside id="drawer" aria-label="Detalhes do dispositivo">
  <div class="dhead"><h2 id="dName">—</h2><button class="close" id="dClose" type="button">×</button></div>
  <div class="rename"><input id="dInput" maxlength="40" placeholder="nome do dispositivo"><button class="ghost" id="dSave" type="button">SALVAR</button></div>
  <dl class="kv" id="dKv"></dl>
  <div class="sessions" id="dSessions"></div>
</aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let state = null, fetchedAt = 0, currentMac = null, drawerData = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => n < 10 ? "0" + n : "" + n;
  const dur = (s) => {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}h ${pad(m)}m` : `${m}m`;
  };
  const hms = (s) => {
    s = Math.max(0, Math.floor(s));
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
  };
  const clockStr = (ts) => {
    const d = new Date(ts * 1000);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const ago = (s) => s < 60 ? `${Math.floor(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`;
  const disp = (d) => d.name || ((d.vendor && !d.vendor.trim().startsWith("(")) ? d.vendor
    : `Dispositivo ${(d.ip || "").split(".").pop() || d.mac.slice(-5)}`);
  const vend = (d) => (d.vendor && !d.vendor.trim().startsWith("(")) ? d.vendor : "vendor desconhecido";

  function tickClock() {
    const d = new Date();
    $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tickClock(); setInterval(tickClock, 1000);

  function liveTimers() {
    if (!state) return;
    const extra = (Date.now() - fetchedAt) / 1000;
    document.querySelectorAll("[data-cur]").forEach((el) => {
      const base = parseFloat(el.dataset.cur || "0");
      el.textContent = base > 0 ? hms(base + extra) : "—";
    });
    const last = state.last_scan ? (Date.now() / 1000 - state.last_scan) : null;
    $("lastScan").textContent = last === null ? "aguardando sweep" : `último sweep ${ago(last)} atrás`;
  }
  setInterval(liveTimers, 1000);

  async function refresh() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      state = await r.json();
      fetchedAt = Date.now();
      render();
      liveTimers();
      if (currentMac) openDrawer(currentMac, true);
    } catch (e) {
      $("ticker").textContent = "LINK PERDIDO — tentando novamente";
    }
  }

  function render() {
    const s = state.stats;
    $("sOnline").textContent = s.online;
    $("sKnown").textContent = s.known;
    $("sSessions").textContent = s.sessions_24h;
    $("sNew").textContent = s.new_24h;
    $("ticker").textContent = `LAN 192.168.5.0/24 · ${s.online} ONLINE · SWEEP ${state.interval}S`;

    const grid = $("grid");
    grid.innerHTML = state.devices.map((d) => {
      const pct = Math.min(100, Math.round(d.total_24h / 86400 * 100));
      return `<button class="card hy-card ${d.online ? "hy-card--lime" : ""} ${d.online ? "" : "off"}" data-mac="${esc(d.mac)}" type="button">
        <div class="crow"><span class="dot ${d.online ? "on" : ""}"></span>
          <span class="name">${esc(disp(d))}</span>
          <span class="chip ${d.online ? "online" : "off"}">${d.online ? "ONLINE" : "OFFLINE"}</span></div>
        <div class="ip">${esc(d.ip || "—")}</div>
        <div class="vendor">${esc(vend(d))}</div>
        <div class="metrics">
          <div><b>AGORA</b><span data-cur="${d.current_session}">${d.current_session ? hms(d.current_session) : "—"}</span></div>
          <div><b>24H</b><span>${dur(d.total_24h)}</span></div>
          <div><b>SESSÕES</b><span>${d.sessions_24h}</span></div>
        </div>
        <div class="hy-gauge ${d.online ? "hy-gauge--lime" : ""}"><i style="width:${pct}%"></i></div>
        <div class="foot"><span>MAC ${esc(d.mac)}</span><span>${pct}% ONLINE</span></div>
      </button>`;
    }).join("") || `<div class="empty">NENHUM DISPOSITIVO AINDA — PRIMEIRO SWEEP EM ANDAMENTO</div>`;

    const tl = $("timeline");
    tl.innerHTML = state.devices.map((d) => {
      const cells = d.timeline.map((v, i) => {
        const t0 = new Date((state.now - 86400 + i * 900) * 1000);
        const t1 = new Date((state.now - 86400 + (i + 1) * 900) * 1000);
        const label = `${clockStr(t0.getTime() / 1000)}–${clockStr(t1.getTime() / 1000)} · ${Math.round(v * 100)}%`;
        const bg = v <= 0 ? "" : ` style="background:rgba(34,232,255,${(0.12 + v * 0.46).toFixed(2)});border-color:rgba(34,232,255,${(0.18 + v * 0.42).toFixed(2)})"`;
        return `<i${bg} title="${label}"></i>`;
      }).join("");
      return `<div class="trow"><div class="tname">${esc(disp(d))}</div>
        <div class="cells">${cells}</div><div class="ttot">${dur(d.total_24h)}</div></div>`;
    }).join("") || `<div class="empty">SEM HISTÓRICO NAS ÚLTIMAS 24H</div>`;
  }

  async function openDrawer(mac, silent) {
    currentMac = mac;
    const r = await fetch(`/api/device?mac=${encodeURIComponent(mac)}`, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    drawerData = d;
    $("dName").textContent = disp(d);
    $("dInput").value = d.name || "";
    const st = d.online ? `<span class="live">ONLINE</span>` : "OFFLINE";
    const onlineNow = d.current_session ? hms(d.current_session + (Date.now() - fetchedAt) / 1000) : "—";
    $("dKv").innerHTML = `
      <dt>status</dt><dd>${st}</dd>
      <dt>ip</dt><dd>${esc(d.ip || "—")}</dd>
      <dt>mac</dt><dd>${esc(d.mac)}</dd>
      <dt>vendor</dt><dd>${esc(vend(d))}</dd>
      <dt>primeiro seen</dt><dd>${new Date(d.first_seen * 1000).toLocaleString("pt-BR")}</dd>
      <dt>último seen</dt><dd>${new Date(d.last_seen * 1000).toLocaleString("pt-BR")}</dd>
      <dt>agora</dt><dd>${onlineNow}</dd>
      <dt>total histórico</dt><dd>${dur(d.total_seconds)}</dd>`;
    $("dSessions").innerHTML = `<div class="srow"><b>INÍCIO</b><b>FIM</b><b>DURAÇÃO</b></div>` +
      d.sessions.map((s) => {
        const end = s.end ?? Math.floor(Date.now() / 1000);
        return `<div class="srow"><span>${new Date(s.start * 1000).toLocaleString("pt-BR")}</span>
          <span>${s.end ? new Date(s.end * 1000).toLocaleTimeString("pt-BR") : '<b class="live">AGORA</b>'}</span>
          <span>${dur(end - s.start)}</span></div>`;
      }).join("");
    if (!silent) {
      $("shade").classList.add("open");
      $("drawer").classList.add("open");
    }
  }

  function closeDrawer() {
    currentMac = null;
    $("shade").classList.remove("open");
    $("drawer").classList.remove("open");
  }

  $("grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) openDrawer(card.dataset.mac);
  });
  $("dClose").addEventListener("click", closeDrawer);
  $("shade").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  $("dSave").addEventListener("click", async () => {
    if (!currentMac) return;
    const name = $("dInput").value.trim();
    if (!name) return;
    await fetch("/api/name", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mac: currentMac, name })
    });
    await refresh();
    $("dName").textContent = name;
  });

  $("scanBtn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "SCANNING…";
    await fetch("/api/scan", { method: "POST" });
    setTimeout(async () => {
      await refresh();
      e.target.disabled = false;
      e.target.textContent = "SCAN NOW";
    }, 5000);
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
