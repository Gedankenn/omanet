services:
  omanet:
    build: .
    container_name: omanet
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/data
    environment:
      PORT: ${PORT:-20211}
      BIND: ${BIND:-127.0.0.1}
      OMANET_TOKEN: ${OMANET_TOKEN:-}
      IFACE: ${IFACE:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      TZ: ${TZ:-America/Sao_Paulo}
